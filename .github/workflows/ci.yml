name: Dashboard CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out canonical backend contracts
        uses: actions/checkout@v4
        with:
          repository: Kairos-Portfolio-Manager/portfolio-manager
          ref: mandate-v3
          path: portfolio-manager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check backend contract mirrors
        run: npm run check:contracts

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  hygiene:
    name: Patch and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace and merge-marker errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          fi
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
